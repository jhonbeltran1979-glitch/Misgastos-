<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#f59e0b"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="MisGastos"/>
  <title>MisGastos 💸</title>
  <link rel="manifest" href="./manifest.json"/>
  <link rel="apple-touch-icon" href="./icon-192.png"/>
  <link rel="icon" type="image/png" href="./icon-192.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:#0f172a;color:#f1f5f9;font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
    input,select,button{font-family:inherit}
    input:focus,select:focus{outline:none}
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:#1e293b}
    ::-webkit-scrollbar-thumb{background:#334155;border-radius:2px}
    @keyframes fadeUp{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes slideIn{from{transform:translateY(-10px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes spin{to{transform:rotate(360deg)}}
    .fade{animation:fadeUp .35s ease}
    .tab-btn{flex:1;padding:10px 0;border:none;cursor:pointer;font-size:13px;font-weight:600;background:none;border-bottom:2px solid transparent;transition:all .2s;color:#64748b}
    .tab-btn.active{color:#f59e0b;border-bottom-color:#f59e0b}
    .cat-btn{background:#1e293b;border:2px solid #334155;border-radius:14px;padding:13px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;transition:all .15s;width:100%}
    .inp{width:100%;background:#1e293b;border:2px solid #334155;border-radius:12px;padding:14px 15px;font-size:15px;color:#f1f5f9;transition:border .2s}
    .inp:focus{border-color:#f59e0b}
    .btn-primary{width:100%;padding:17px;border:none;border-radius:14px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#000;font-size:16px;font-weight:700;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:all .2s}
    .btn-primary:disabled{background:#334155;color:#64748b;cursor:not-allowed}
    .card{background:#1e293b;border-radius:16px;padding:18px 16px;margin-bottom:14px}
    .gasto-row{background:#1e293b;border-radius:14px;padding:13px 14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
    .modal{background:#1e293b;border-radius:20px;padding:28px;width:100%;max-width:480px;border:1px solid #334155}
    .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);border-radius:12px;padding:12px 22px;font-weight:600;font-size:14px;z-index:300;white-space:nowrap;box-shadow:0 8px 32px rgba(0,0,0,.5);pointer-events:none}
    select{background:#1e293b;border:1px solid #334155;color:#f1f5f9;border-radius:8px;padding:6px 8px;font-size:12px;cursor:pointer}
    :root{color-scheme:dark;--bg:#0b1220;--surface:#151f31;--surface-raised:#1a2639;--line:#2a3850;--muted:#a0aec0;--text:#f4f7fb;--gold:#f6ad2e;--green:#26c49a}
    html,body{background:var(--bg);color:var(--text);overscroll-behavior-y:contain}
    button,select,input{font:inherit}
    button{-webkit-tap-highlight-color:transparent}
    #app>div:first-child{background:rgba(15,24,39,.94)!important;border-bottom-color:var(--line)!important;backdrop-filter:blur(18px);padding-top:max(12px,env(safe-area-inset-top))!important}
    .tab-strip{gap:8px!important;padding-bottom:8px!important}
    .tab-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 13px!important;border:1px solid transparent;border-radius:12px 12px 0 0;color:#9ba9bd;white-space:nowrap}
    .tab-btn.active{color:#ffd075;background:rgba(246,173,46,.09);border-color:rgba(246,173,46,.16);border-bottom-color:var(--gold)}
    .tab-icon{font-size:16px;line-height:1;width:31px;height:31px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(145deg,#34465c,#182538);border:1px solid #ffffff16;box-shadow:inset 1px 1px 2px #ffffff20,inset -2px -3px 4px #080e18a8,0 4px 8px #050a1280;text-shadow:0 2px 2px #0009;transform:translateY(-1px)}
    .icon-3d{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(145deg,#35475d,#19263a);border:1px solid #ffffff16;box-shadow:inset 2px 2px 3px #ffffff1e,inset -3px -4px 6px #070d18a8,0 6px 11px #050a1270;text-shadow:0 2px 3px #0009;filter:saturate(1.12);transform:translateY(-1px)}
    .category-icon{width:44px;height:44px;flex-basis:44px;border-radius:15px;font-size:23px!important;background:linear-gradient(145deg,#2c3c52,#162236);box-shadow:inset 2px 2px 4px #ffffff20,inset -3px -4px 6px #070d18b0,0 6px 12px #03081180}
    .tiny-icon{width:36px;height:36px;flex-basis:36px;border-radius:12px;font-size:20px!important}
    .large-icon{width:58px;height:58px;flex-basis:58px;border-radius:20px;font-size:30px!important;margin-inline:auto}
    .goal-icon{width:50px;height:50px;flex-basis:50px;border-radius:16px}
    .goal-icon.large-icon{width:58px;height:58px;flex-basis:58px}
    .fridge-art{position:relative;display:block;width:29px;height:43px;border:2px solid #7dd3fc;border-radius:6px;background:linear-gradient(100deg,#fff 0%,#e0f2fe 42%,#93c5fd 100%);box-shadow:3px 4px 7px #0009,inset 2px 0 3px #fff;transform:perspective(70px) rotateY(-7deg)}
    .fridge-split{position:absolute;left:1px;right:1px;top:38%;height:2px;background:#3b82f6;box-shadow:0 1px #ffffffa0}
    .fridge-handle{position:absolute;right:3px;width:3px;border-radius:3px;background:linear-gradient(90deg,#1d4ed8,#60a5fa,#fff);box-shadow:1px 1px 2px #0008}
    .fridge-handle.top{top:12%;height:10px}.fridge-handle.bottom{top:51%;height:14px}
    .mattress-art{position:relative;display:block;width:43px;height:35px;transform:rotate(-5deg)}
    .mattress-top{position:absolute;left:4px;top:4px;width:36px;height:19px;border:1px solid #c4b5fd;border-radius:8px 8px 4px 4px;background:linear-gradient(145deg,#fff 0%,#e0e7ff 56%,#a5b4fc 100%);box-shadow:2px 2px 4px #0009,inset 1px 1px 2px #fff}
    .mattress-side{position:absolute;left:4px;top:20px;width:36px;height:9px;border-radius:2px 3px 5px 5px;background:linear-gradient(90deg,#c7d2fe,#818cf8 72%,#6366f1);box-shadow:2px 3px 3px #0009}
    .mattress-pillow{position:absolute;z-index:1;left:8px;top:7px;width:12px;height:8px;border-radius:4px;background:linear-gradient(145deg,#fff,#dbeafe);box-shadow:1px 1px 2px #64748b80}
    .mattress-seam{position:absolute;z-index:2;left:5px;right:4px;top:23px;height:1px;background:#eef2ff;box-shadow:0 1px #4f46e580}
    .cat-btn:hover .category-icon,.gasto-row:hover .icon-3d{transform:translateY(-3px) scale(1.04);box-shadow:inset 2px 2px 3px #ffffff24,inset -3px -4px 6px #070d18b0,0 9px 15px #030811a0}
    .icon-sel{box-shadow:inset 2px 2px 3px #ffffff18,inset -2px -3px 4px #070d18a0,0 4px 7px #03081170!important}
    #sel-m,#sel-y{background:#1a2639;border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--text);font-size:13px}
    #res-card{background:linear-gradient(135deg,#1e3144,#172535)!important;border:1px solid #30465a;box-shadow:0 12px 30px #050b1470;color:var(--text)}
    #res-tot{color:#fff!important;font-size:clamp(27px,7vw,34px)!important}
    #res-lbl{color:#b9c7d7!important;letter-spacing:.07em}
    #res-cnt{color:#93a7ba!important}
    .card,.gasto-row{background:var(--surface)!important;border:1px solid rgba(148,163,184,.08);border-radius:18px}
    .card{padding:20px}
    .gasto-row{padding:15px;margin-bottom:10px}
    .cat-btn{min-height:86px;background:var(--surface)!important;border-color:var(--line)!important;border-radius:16px}
    .inp{background:var(--surface);border-color:var(--line);border-radius:14px}
    .btn-primary{background:linear-gradient(135deg,#ffd06c,#f2a521);border-radius:15px;box-shadow:0 8px 18px #f59e0b20}
    .modal-overlay{backdrop-filter:blur(5px)}
    #app [style*="color:#64748b"],#app [style*="color: #64748b"]{color:#a2b1c2!important}
    #app [style*="color:#475569"],#app [style*="color: #475569"]{color:#8999ad!important}
    @media(max-width:640px){
      body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
      #app>div:first-child{padding:12px 14px 0!important}
      #app>div:first-child>div{margin-bottom:0!important}
      .tab-strip{position:fixed;z-index:100;left:0;right:0;bottom:0;display:flex!important;gap:3px!important;padding:8px 8px calc(8px + env(safe-area-inset-bottom))!important;background:rgba(13,21,35,.97);border-top:1px solid var(--line);backdrop-filter:blur(18px);overflow:visible!important}
      .tab-btn{min-width:0;flex:1;flex-direction:column;gap:4px;padding:7px 2px!important;border:0!important;border-radius:10px;font-size:10px;line-height:1.1}
      .tab-btn.active{background:rgba(246,173,46,.1);border:0!important}
      .tab-icon{font-size:19px;width:32px;height:32px}
      .icon-3d{box-shadow:inset 2px 2px 3px #ffffff1e,inset -3px -4px 6px #070d18b0,0 5px 9px #03081170}
      #app>div:first-child>div>div:first-child{margin-bottom:9px!important}
      #app>div:nth-child(2){padding:14px 13px 20px!important}
      #res-card{padding:17px 16px!important;gap:12px}
      #res-top{text-align:right}
      .card{padding:17px 15px}
      #modal .modal,#modal-prov .modal{padding:22px 19px;max-height:88dvh;overflow:auto}
    }
    @media(min-width:641px){#app>div:nth-child(2){max-width:760px!important;padding-top:26px!important}}
  </style>
</head>
<body>
<div id="app">
  <!-- Header -->
  <div style="background:linear-gradient(135deg,#1e293b,#0f172a);border-bottom:1px solid #1e293b;padding:20px 20px 0;position:sticky;top:0;z-index:50">
    <div style="max-width:640px;margin:0 auto">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <div>
        <div style="display:flex;align-items:center;gap:9px;font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;letter-spacing:-.5px"><span class="icon-3d tiny-icon">💸</span>MisGastos</div>
          <div style="display:flex;align-items:center;gap:6px;margin-top:3px">
            <div id="dot" style="width:7px;height:7px;border-radius:50%;background:#ef4444"></div>
            <span id="conn-lbl" style="font-size:11px;color:#ef4444">Sin configurar</span>
          </div>
        </div>
        <div style="display:flex;gap:7px;align-items:center">
          <select id="sel-m"></select>
          <select id="sel-y"></select>
          <button id="btn-sync" style="background:#1e293b;border:1px solid #334155;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:15px;display:none" title="Sync">🔄</button>
          <button onclick="openCfg()" style="background:#1e293b;border:1px solid #334155;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:15px">⚙️</button>
        </div>
      </div>
      <div class="tab-strip" style="display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none">
        <button class="tab-btn active" id="t-r" onclick="setTab('r')"><span class="tab-icon">✏️</span><span>Registrar</span></button>
        <button class="tab-btn" id="t-g" onclick="setTab('g')"><span class="tab-icon">📊</span><span>Análisis</span></button>
        <button class="tab-btn" id="t-h" onclick="setTab('h')"><span class="tab-icon">📋</span><span>Historial</span></button>
        <button class="tab-btn" id="t-b" onclick="setTab('b')"><span class="tab-icon">🧾</span><span>Presupuesto</span></button>
        <button class="tab-btn" id="t-p" onclick="setTab('p')"><span class="tab-icon">🎯</span><span>Metas</span></button>
        <button class="tab-btn" id="t-i" onclick="setTab('i')"><span class="tab-icon">💵</span><span>Ingresos</span></button>
      </div>
    </div>
  </div>

  <div style="max-width:640px;margin:0 auto;padding:20px 16px 80px">
    <div id="res-card" style="display:none;background:linear-gradient(135deg,#f59e0b,#d97706);border-radius:16px;padding:20px 24px;margin-bottom:20px;display:none;justify-content:space-between;align-items:center">
      <div>
        <div id="res-lbl" style="font-size:12px;font-weight:600;color:rgba(0,0,0,.6);margin-bottom:4px">TOTAL</div>
        <div id="res-tot" style="font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;color:#000;letter-spacing:-1px">$0</div>
        <div id="res-cnt" style="font-size:12px;color:rgba(0,0,0,.5);margin-top:4px">0 transacciones</div>
      </div>
      <div id="res-top"></div>
    </div>
    <div id="pnl-r" class="fade"></div>
    <div id="pnl-g" class="fade" style="display:none"></div>
    <div id="pnl-h" class="fade" style="display:none"></div>
    <div id="pnl-b" class="fade" style="display:none"></div>
    <div id="pnl-p" class="fade" style="display:none"></div>
    <div id="pnl-i" class="fade" style="display:none"></div>
    <div id="pnl-setup" style="display:none"></div>
  </div>
</div>

<!-- Modal -->
<div id="modal-prov" class="modal-overlay" style="display:none"></div>
<div id="modal" class="modal-overlay" style="display:none">
  <div class="modal">
    <div style="font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;margin-bottom:6px">⚙️ Google Sheet URL</div>
    <div style="font-size:13px;color:#64748b;margin-bottom:20px;line-height:1.7">Pega el URL de tu <strong style="color:#f1f5f9">Apps Script Web App</strong>.<br>(Sheet → Extensiones → Apps Script → Implementar → Web App)</div>
    <input id="url-inp" class="inp" placeholder="https://script.google.com/macros/s/..." style="margin-bottom:16px"/>
    <div style="display:flex;gap:10px">
      <button onclick="closeCfg()" style="flex:1;padding:14px;background:#334155;border:none;border-radius:12px;color:#94a3b8;font-size:14px;font-weight:600;cursor:pointer">Cancelar</button>
      <button onclick="saveUrl()" style="flex:2;padding:14px;background:linear-gradient(135deg,#f59e0b,#d97706);border:none;border-radius:12px;color:#000;font-size:14px;font-weight:700;cursor:pointer">✅ Guardar y Conectar</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" style="display:none"></div>

<script>
const CATS=[
  {id:"gasolina",label:"Gasolina",icon:"⛽",color:"#f59e0b"},
  {id:"mercado",label:"Mercado",icon:"🛒",color:"#10b981"},
  {id:"luz",label:"Luz",icon:"💡",color:"#fbbf24"},
  {id:"agua",label:"Agua",icon:"💧",color:"#38bdf8"},
  {id:"internet",label:"Internet",icon:"📡",color:"#818cf8"},
  {id:"administracion",label:"Administ.",icon:"🏢",color:"#a78bfa"},
  {id:"recarga_celular",label:"Recarga celular",icon:"📲",color:"#06b6d4"},
  {id:"donacion_iglesia",label:"Donación iglesia",icon:"⛪",color:"#fbbf24"},
  {id:"restaurante",label:"Restaurante",icon:"🍽️",color:"#fb923c"},
  {id:"salud",label:"Salud",icon:"🏥",color:"#34d399"},
  {id:"transporte",label:"Transporte",icon:"🚗",color:"#60a5fa"},
  {id:"parqueadero",label:"Parqueadero",icon:"🅿️",color:"#0ea5e9"},
  {id:"entretenimiento",label:"Entretenim.",icon:"🎬",color:"#f472b6"},
  {id:"ropa",label:"Ropa",icon:"👗",color:"#c084fc"},
  {id:"mantenimiento",label:"Mant. Carro",icon:"🔧",color:"#64748b"},
  {id:"suscripcion_ia",label:"Suscripción IA",icon:"🤖",color:"#8b5cf6"},
  {id:"pension",label:"Pensión Daniela",icon:"🎒",color:"#84cc16"},
  {id:"mami",label:"Cuota Mami",icon:"👩‍❤️‍👨",color:"#ec4899"},
  {id:"vanti",label:"Vanti Gas",icon:"🔥",color:"#f97316"},
  {id:"otro",label:"Otro",icon:"📦",color:"#94a3b8"},
];
const MES=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const URLK="misgastos_url";
let gastos=[],url="",selCat=null,tab="r";
let fm=new Date().getMonth(),fy=new Date().getFullYear(),tTimer=null;

const $=id=>document.getElementById(id);
const fmt=n=>new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(n);
const fmtS=n=>n>=1e6?`$${(n/1e6).toFixed(1)}M`:n>=1e3?`$${(n/1e3).toFixed(0)}K`:`$${n}`;
const hoy=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const ahora=()=>new Date().toLocaleString("es-CO",{dateStyle:"short",timeStyle:"short"});

function toast(msg,t="ok"){
  const e=$("toast");
  e.textContent=msg; e.style.background=t==="err"?"#ef4444":"#10b981"; e.style.display="block";
  clearTimeout(tTimer); tTimer=setTimeout(()=>e.style.display="none",3500);
}

function setConn(on,sync=false){
  $("dot").style.background=on?"#10b981":"#ef4444";
  $("conn-lbl").style.color=on?"#10b981":"#ef4444";
  $("conn-lbl").textContent=!on?"Sin configurar":sync?"Sincronizando…":"Sheets conectado";
  $("btn-sync").style.display=on?"block":"none";
}

async function fetchGastos(u){
  if(!u)return;
  setConn(true,true);
  try{
    const r=await fetch(`${u}?t=${Date.now()}`);
    const d=await r.json();
    if(d.gastos){gastos=[...d.gastos].reverse();render();}
  }catch{toast("Error conectando Sheets","err");}
  setConn(true,false);
}

function openCfg(){$("modal").style.display="flex";$("url-inp").value=url;}
function closeCfg(){$("modal").style.display="none";}
function saveUrl(){
  const u=$("url-inp").value.trim();
  if(!u.startsWith("https://script.google.com"))return toast("URL inválida","err");
  localStorage.setItem(URLK,u); url=u; closeCfg();
  toast("✅ Conectado con Google Sheets"); fetchGastos(u);
}

function parseDate(f){
  try{
    const s=String(f||"").trim();
    if(/^\d{4}-\d{2}-\d{2}/.test(s)) return new Date(s.substring(0,10)+"T12:00:00");
    return new Date(s);
  }catch{return new Date();}
}
function gf(){
  return gastos.filter(g=>{
    const d=parseDate(g.fecha);
    return d.getMonth()===fm&&d.getFullYear()===fy;
  });
}

function buildSel(){
  const sm=$("sel-m"),sy=$("sel-y");
  sm.innerHTML=MES.map((m,i)=>`<option value="${i}"${i===fm?" selected":""}>${m}</option>`).join("");
  const yrs=[...new Set(gastos.map(g=>parseDate(g.fecha).getFullYear()))];
  if(!yrs.includes(fy))yrs.push(fy); yrs.sort((a,b)=>b-a);
  sy.innerHTML=yrs.map(y=>`<option value="${y}"${y===fy?" selected":""}>${y}</option>`).join("");
  sm.onchange=e=>{fm=+e.target.value;render();};
  sy.onchange=e=>{fy=+e.target.value;render();};
}

function selCatFn(id){selCat=selCat===id?null:id;renderR();}

async function registrar(){
  if(!url)return toast("Configura tu Google Sheet ⚙️","err");
  if(!selCat)return toast("Selecciona una categoría","err");
  const val=parseFloat($("ia").value.replace(/[^0-9.]/g,""));
  if(!val||val<=0)return toast("Ingresa un valor válido","err");
  const cat=CATS.find(c=>c.id===selCat);
  const desc=$("id").value.trim()||cat.label;
  const g={id:Date.now(),fecha:hoy(),fechaHora:ahora(),categoria:selCat,label:cat.label,icon:cat.icon,color:cat.color,monto:val,descripcion:desc};
  const b=$("breg"); b.disabled=true; b.textContent="⏳ Guardando…";
  try{
    const r=await fetch(url,{method:"POST",body:JSON.stringify({accion:"add",gasto:g})});
    const d=await r.json();
    if(d.ok){gastos=[g,...gastos];selCat=null;toast(`${cat.icon} ${fmt(val)} guardado ✅`);render();}
    else toast("Error al guardar","err");
  }catch{toast("Error de conexión","err");}
  const b2=$("breg"); if(b2){b2.disabled=false;b2.textContent="✅ Registrar Gasto";}
}

async function eliminar(id){
  try{
    const r=await fetch(url,{method:"POST",body:JSON.stringify({accion:"delete",id})});
    const d=await r.json();
    if(d.ok){gastos=gastos.filter(g=>g.id!==id);toast("Eliminado","err");render();}
  }catch{toast("Error","err");}
}

function confirmDel(id){
  const b=$("d"+id); if(!b)return;
  b.outerHTML=`<span id="d${id}">

const PROYECCION_KEY="misgastos_tasa_proyeccion";
const PROYECCION_IPC_REFERENCIA=6.24;
function getTasaProyeccion(){
  const guardadaRaw=localStorage.getItem(PROYECCION_KEY);
  if(guardadaRaw===null)return PROYECCION_IPC_REFERENCIA;
  const guardada=Number(guardadaRaw);
  return Number.isFinite(guardada)&&guardada>=0&&guardada<=30?guardada:PROYECCION_IPC_REFERENCIA;
}
function guardarTasaProyeccion(){
  const input=$("proy-tasa"), tasa=Number(input?.value);
  if(!Number.isFinite(tasa)||tasa<0||tasa>30)return toast("Ingresa un ajuste entre 0% y 30%","err");
  localStorage.setItem(PROYECCION_KEY,String(tasa));
  renderG();
  toast("✅ Proyección anual actualizada");
}

];
const PROV_KEY = "misgastos_prov";

function getProvState(){
  try{ return JSON.parse(localStorage.getItem(PROV_KEY)||"{}"); }catch{ return {}; }
}
function saveProvState(s){ localStorage.setItem(PROV_KEY, JSON.stringify(s)); }
function iconoProvision(p){return p.iconHtml||p.icon;}
function claseIconoProvision(p){return `icon-3d${p.iconHtml?" goal-icon":""}`;}
function acumuladoProvision(id,soloAnio=false){
  const aportes=Object.entries(getProvState()).reduce((total,[key,value])=>{
    const pertenece=key.endsWith(`-${id}`)&&(!soloAnio||key.startsWith(`${fy}-`));
    return total+(pertenece?Number(value)||0:0);
  },0);
  if(id!=="ropa")return aportes;
  const inicioFondo=new Date(2026,9,1);
  const compras=gastos.filter(g=>{
    if(g.categoria!=="ropa")return false;
    const d=parseDate(g.fecha);
    return d>=inicioFondo&&(!soloAnio||d.getFullYear()===fy);
  }).reduce((s,g)=>s+(Number(g.monto)||0),0);
  return Math.max(0,aportes-compras);
}
function aporteSugerido(p){
  if(!p.meta)return p.mensual;
  const [year,month]=p.fechaMeta.split("-").map(Number);
  const meses=Math.max(1,(year-fy)*12+(month-1-fm));
  const estado=getProvState();
  const guardadoMes=Number(estado[`${fy}-${fm}-${p.id}`])||0;
  const guardadoPrevio=Math.max(0,acumuladoProvision(p.id)-guardadoMes);
  return Math.max(0,(p.meta-guardadoPrevio)/meses-guardadoMes);
}
function metaPeriodo(p){return p.meta||p.mensual*12;}

  `;

function guardarProv(id){
  const val=parseFloat($("prov-inp").value.replace(/[^0-9.]/g,""));
  if(!val||val<=0) return toast("Ingresa un valor válido","err");
  const s=getProvState();
  s[`${fy}-${fm}-${id}`]=val;
  saveProvState(s);
  cerrarModalProv();
  toast("✅ Ahorro registrado");
  renderP();
}

function borrarProv(id){
  const s=getProvState();
  delete s[`${fy}-${fm}-${id}`];
  saveProvState(s);
  cerrarModalProv();
  renderP();
}

function getPlan(){

function planMonto(p){const m=getPlan()[p.id];return Number.isFinite(Number(m))&&m!==""?Number(m):p.monto;}
function guardarPlan(){
  const state={};
  PLAN_GASTOS.forEach(p=>{const value=Number($("plan-"+p.id)?.value);state[p.id]=Number.isFinite(value)&&value>=0?value:p.monto;});
  localStorage.setItem(PLAN_KEY,JSON.stringify(state));
  toast("✅ Presupuesto mensual guardado");
  renderB();
}
function gastoPresupuestado(p){
  return gf().filter(g=>{
    const esPrincipal=g.categoria===p.categoria;
    const esAlterna=g.categoria===p.categoriaAlterna;
    if(!esPrincipal&&!esAlterna)return false;
    const d=String(g.descripcion||"");
    if(esAlterna)return p.excluir||!p.descripcion||p.descripcion.test(d);
    if(esPrincipal&&p.categoriaAlterna&&p.descripcion)return true;
    if(p.descripcion&&p.excluir)return !p.descripcion.test(d);
    if(p.descripcion)return p.descripcion.test(d);
    return true;
  }).reduce((s,g)=>s+(Number(g.monto)||0),0);
}

function agregarIngreso(){
  const nombre = $("ing-nombre").value.trim();
  const monto  = parseFloat($("ing-monto").value.replace(/[^0-9.]/g,""));
  const icon   = $("ing-icon").value || "💵";
  if(!nombre) return toast("Escribe el nombre de la fuente","err");
  if(!monto||monto<=0) return toast("Ingresa un monto válido","err");
  const lista = getIngresos();
  lista.push({ id:Date.now(), nombre, monto, icon });
  saveIngresos(lista);
  $("ing-nombre").value="";
  $("ing-monto").value="";
  $("ing-icon").value="💵";
  toast(`✅ ${nombre} agregado`);
  renderI();
}

  const lista = getIngresos().filter(i=>i.id!==id);

function setTab(t){
  tab=t;

    if(t==="r")renderR();
    if(t==="g")renderG();
    if(t==="h")renderH();
    if(t==="b")renderB();
    if(t==="p")renderP();
    if(t==="i")renderI();
  }
}

function render(){
  buildSel();
  renderResumen();
  const hasUrl=!!url;

  if(hasUrl){
    if(tab==="r")renderR();
    if(tab==="g")renderG();
    if(tab==="h")renderH();
    if(tab==="b")renderB();
    if(tab==="p")renderP();
    if(tab==="i")renderI();
  } else renderSetup();
}
